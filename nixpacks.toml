[providers]
providers = ['python']

[variables]
PYTHON_VERSION = '3.10'

[phases.setup]
nixPkgs = ['python310', 'gcc', 'postgresql']

[phases.install]
cmds = ['pip install --upgrade pip', 'pip install -r requirements.txt']

[start]
cmd = 'cd backend && alembic upgrade head && uvicorn api:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips="*"'
